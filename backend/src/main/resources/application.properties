spring.application.name=talentpulse-backend
server.port=8080

# Database Configuration (H2 In-Memory by default)
spring.datasource.url=jdbc:h2:mem:talentpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Settings (for resumes)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
talentpulse.jwt.secret=9a2f8c4e7b1d3a5f6e8c9b0a2f4e6d8c1b3a5f7e9d0c2b4a6f8e0d2c4b6a8f1e
talentpulse.jwt.expiration-ms=86400000

# Swagger / Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
